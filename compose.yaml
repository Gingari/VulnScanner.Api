services:
  api:
    image: "${API_IMAGE:-gingari/vulnscanner-api:1.0.0}"

    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"

    env_file:
      - .env

    init: true
    read_only: true

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    cpus: ${API_CPUS:-2.0}
    mem_limit: "${API_MEMORY:-3g}"
    pids_limit: ${API_PIDS_LIMIT:-256}

    tmpfs:
      - "/work/tmp:rw,noexec,nosuid,size=${API_TEMP_SIZE:-512m},uid=1654,gid=1654,mode=0700"

    volumes:
      - trivy-cache:/work/cache

volumes:
  trivy-cache: